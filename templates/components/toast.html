<!-- templates/components/toast.html -->
<div id="toast-container" class="toast-container">
    <!-- Las notificaciones se inyectarán aquí dinámicamente vía JS -->
</div>

<!-- Contenedor invisible para que JS lea los mensajes de Flask -->
<div id="flask-messages" style="display: none;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <span class="flask-flash" data-category="{{ category }}" data-message="{{ message }}"></span>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<!-- Importar la lógica global de las alertas -->
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
