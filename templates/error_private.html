{% extends 'base.html' %}

{% block title %}Error {{ codigo }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">

<div class="error-container">
    <div class="error-card">
        <h1>{{ codigo }}</h1>
        <h2>{{ mensaje }}</h2>
        <p>{{ descripcion }}</p>
        <a href="/dashboard/{{ role }}" class="back-btn-error">← Volver al Sistema</a>
    </div>
</div>
{% endblock %}
